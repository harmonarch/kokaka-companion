name = "ai-companion-api"
main = "src/index.ts"
compatibility_date = "2026-07-24"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[vars]
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "2592000"
LLM_PROVIDER = "deepseek"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
SENTRY_ENVIRONMENT = "production"
SENTRY_TRACES_SAMPLE_RATE = "0.1"
TOKEN_ALERT_HARD_LIMIT = "2000"
# 浏览器来源白名单（逗号分隔）。不配置则 API 对任意来源开放跨域。
# CORS_ALLOWED_ORIGINS = "https://dashboard.example.com,https://app.example.com"

[observability]
enabled = true

[triggers]
crons = ["0 3 * * *"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "ai-companion-production"
database_id = "2e736187-10f2-4aac-bb09-9b9a5f4a8bc5"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "CHAT_CONTEXT"
id = "3bcdf59e2a224ea7b15b3fbcd645a4e9"
